name: Deploy no GitHub Pages

on:
  push:
    branches: [main]
  # Permite executar manualmente pela aba Actions.
  workflow_dispatch:

# Permissoes minimas necessarias para publicar no Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy por vez; nao cancela um deploy em andamento.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Build (type-check + Vite)
        run: npm run build
        env:
          # Vazio no repositorio => "." (caminhos relativos, funciona em subpasta).
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL || '.' }}

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Empacotar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4